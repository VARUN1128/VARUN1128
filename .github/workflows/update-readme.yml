name: Update README (live data)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live data and rewrite README
        run: python3 scripts/update_readme.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build contribution graph (includes private repos)
        run: python3 scripts/contrib_graph.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Commit changes
        run: |
          git config user.name "readme-bot"
          git config user.email "readme-bot@users.noreply.github.com"
          git add README.md assets/contributions.svg
          git diff --cached --quiet || git commit -m "chore: refresh live stats"
          git push
